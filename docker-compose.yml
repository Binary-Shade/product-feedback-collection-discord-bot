services:
  api:
    build: .
    command: python run_api.py
    env_file: .env
    environment:
      - API_PORT=8009
    ports:
      - "127.0.0.1:8009:8009"
    volumes:
      - data:/srv/data
      - ./feedback.db:/srv/feedback.db
    restart: unless-stopped

  bot:
    build: .
    command: python run_bot.py
    env_file: .env
    volumes:
      - ./feedback.db:/srv/feedback.db
    restart: unless-stopped
    depends_on:
      - api

  duckdns:
    image: lscr.io/linuxserver/duckdns:latest
    restart: unless-stopped
    env_file: .env
    environment:
      - SUBDOMAINS=binary-shade
      - TOKEN=${DUCKDNS_TOKEN}
      - TZ=UTC

volumes:
  data:
